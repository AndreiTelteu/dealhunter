version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: olx-deal-hunter-app-prod
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - olx-deal-hunter-prod
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_DATABASE=olx_deal_hunter
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    volumes:
      - storage_data:/var/www/storage

  db:
    image: postgres:15-alpine
    container_name: olx-deal-hunter-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: olx_deal_hunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - olx-deal-hunter-prod

  redis:
    image: redis:7-alpine
    container_name: olx-deal-hunter-redis-prod
    restart: unless-stopped
    networks:
      - olx-deal-hunter-prod
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  olx-deal-hunter-prod:
    driver: bridge