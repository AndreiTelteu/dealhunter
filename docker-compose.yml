version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olx-deal-hunter-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - olx-deal-hunter
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_DATABASE=olx_deal_hunter
      - DB_USERNAME=postgres
      - DB_PASSWORD=password

  db:
    image: postgres:15-alpine
    container_name: olx-deal-hunter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: olx_deal_hunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - olx-deal-hunter

  redis:
    image: redis:7-alpine
    container_name: olx-deal-hunter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - olx-deal-hunter
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: olx-deal-hunter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - olx-deal-hunter

volumes:
  postgres_data:
  redis_data:

networks:
  olx-deal-hunter:
    driver: bridge